<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hana 桌宠控制台</title>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <main class="controller">
    <section class="connection-bar" aria-label="桌宠连接状态">
      <span id="bridge-state" class="connection-state" data-status="disabled" aria-live="polite">连接已关闭</span>
      <span id="follow-context" class="follow-context">等待会话 · 空闲</span>
      <label class="toggle" title="启用或关闭本机桌宠连接">
        <input id="bridge-toggle" type="checkbox" aria-label="启用桌宠连接">
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
    </section>

    <p id="panel-notice" class="panel-notice" role="status" aria-live="polite"></p>
    <p id="follow-release-notice" class="follow-release-notice" role="status" aria-live="polite" hidden></p>

    <section class="stage" aria-label="当前会话与桌宠姿态">
      <div class="stage-art">
        <div class="stage-image-frame">
          <img id="stage-image" src="./assets/poses/claude/idle.webp" width="150" height="168" alt="Claude idle 立绘，桌宠未连接">
          <span id="pose-fallback" class="pose-fallback" hidden>替代</span>
        </div>
        <div class="pose-caption">
          <span id="pose-connection">桌宠未连接</span>
          <span id="pose-name">idle</span>
        </div>
      </div>
      <div class="stage-copy">
        <h1 id="session-title">暂无活动会话</h1>
        <p id="agent" class="stage-agent">Agent 未知 · —</p>
        <p class="state-line"><span>会话状态</span><strong id="activity-status" class="status-pill idle" aria-live="polite">空闲</strong></p>
        <p id="updated" class="stage-updated">尚未收到公开会话事件</p>
      </div>
    </section>

    <section class="session-panel" aria-labelledby="sessions-title">
      <div class="section-heading">
        <h2 id="sessions-title">会话</h2>
        <div class="follow-controls">
          <span id="follow-mode" class="follow-mode" data-mode="latest">自动跟随</span>
          <button id="follow-auto" class="text-button" type="button" hidden>恢复自动</button>
        </div>
      </div>
      <ol id="sessions" class="sessions" aria-label="可跟随的会话列表">
        <li class="empty">等待公开会话事件</li>
      </ol>
    </section>

    <section class="roles-panel" aria-labelledby="roles-title">
      <div class="section-heading compact-heading">
        <h2 id="roles-title">换角色</h2>
        <span>点击立即切换</span>
      </div>
      <div id="role-options" class="role-options" role="group" aria-label="选择桌宠角色"></div>
    </section>

    <details class="diagnostics">
      <summary>高级与诊断</summary>
      <dl class="diagnostic-grid">
        <div><dt>连接路径</dt><dd id="diag-endpoint">http://127.0.0.1:43127/v3</dd></div>
        <div><dt>快照 revision</dt><dd id="diag-revision">—</dd></div>
        <div><dt>事件计数</dt><dd id="diag-event-count">当前快照不提供</dd></div>
        <div><dt>会话记录</dt><dd id="diag-session-count">0</dd></div>
        <div class="diagnostic-error"><dt>最近错误</dt><dd id="diag-error">无</dd></div>
      </dl>
    </details>

    <div class="legacy-sinks" hidden aria-hidden="true">
      <select id="follow-select" tabindex="-1"></select>
      <p id="session-status"></p>
      <span id="activity-hint" data-hint="none"></span>
    </div>
  </main>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
